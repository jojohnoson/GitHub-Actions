name: Build and Test

on:
  push:
    branches:
      - main
      - master

jobs:
  job:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: List the files in the repository
        run: ls -la
      - name: Build the application
        run: mvn -B clean install -DskipTests=true
      - name: Test the Application
        run: mvn -B test
      - name: Docker Build
        run: docker build -t joeljxhnson/github-actions:latest .
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Push
        run: docker push joeljxhnson/github-actions:latest 
  job:
    name: Deployment 
    runs-on: ubuntu-latest
    steps:
      - name: Server-ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            cd /home/joeljxhnson/github-actions
            docker pull joeljxhnson/github-actions:latest
            docker stop github-actions || true
            docker rm github-actions || true
            docker run -d --name github-actions -p 8090:8090 joeljxhnson/github-actions:latest

