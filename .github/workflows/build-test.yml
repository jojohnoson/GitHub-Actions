name: Build and Test

env:
  DOCKER_IMAGE: joeljxhnson/github-actions:latest

on:
  push:
    branches:
      - main
      - master

jobs:
  job1:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Docker Push
        run: docker push ${{ env.DOCKER_IMAGE }}

  job2:
    needs: job1
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Server-ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found, installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
            fi

            echo "Pulling Docker image: ${{ env.DOCKER_IMAGE }}"
            sudo docker pull ${{ env.DOCKER_IMAGE }}
            sudo docker stop github-actions || true
            sudo docker rm github-actions || true
            sudo docker run -d --name github-actions -p 8090:8090 ${{ env.DOCKER_IMAGE }}