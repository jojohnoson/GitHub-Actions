name: Build and Test

on:
  push:
    branches:
      - main
      - master

jobs:
  job:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List the files in the repository
        run: ls -la 

      - name: Build the application
        run: mvn clean install -DskipTests=true

      - name: Test the Application
        run: mvn test


