name: Build and Test

on:
  push:
    branches:
      - main
      - master

jobs:
  job:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: List the files in the repository
        run: ls -la

      - name: Build the application
        run: mvn -B clean install -DskipTests=true

      - name: Test the Application
        run: mvn -B test

      - name: Docker Build
        run: ddocker build -t joeljxhnson/github-actions:latest .

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Docker Push
        run: docker push joeljxhnson/github-actions:latest 